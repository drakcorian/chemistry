<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ion & Valency Quiz</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#F5A623;min-height:100vh;display:flex;flex-direction:column}

/* ── shared top bar ── */
#bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(0,0,0,0.12);flex-shrink:0}
#prog-wrap{flex:1;height:6px;background:rgba(255,255,255,0.3);border-radius:3px;overflow:hidden}
#prog{height:100%;width:0%;background:#fff;border-radius:3px;transition:width .3s}
#lv{background:rgba(0,0,0,0.2);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px}
#teacher-toggle{background:rgba(0,0,0,0.18);color:#fff;border:none;border-radius:6px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer}

/* ── quiz view ── */
#quiz-view{flex:1;display:flex;flex-direction:column}
#retry-bar{background:#c0392b;color:#fff;font-size:13px;font-weight:600;text-align:center;padding:6px;display:none}
#stage{flex:1;padding:12px;display:flex;justify-content:center;align-items:flex-start}
#card{background:#fff;border-radius:16px;width:100%;max-width:480px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.18)}
#qhead{padding:22px 18px 14px;text-align:center}
#badge{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 10px;border-radius:20px;margin-bottom:8px}
.bpos{background:#E1F5EE;color:#0F6E56}
.bneg{background:#FAECE7;color:#993C1D}
.bcon{background:#EEEDFE;color:#3C3489}
.bform{background:#FEF3E2;color:#854F0B}
#qtext{font-size:21px;font-weight:700;color:#111;line-height:1.3}
#qsub{font-size:12px;color:#999;margin-top:5px}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#d0d0d0;border-top:2px solid #d0d0d0}
.opt{background:#f0f0f0;padding:18px 12px;display:flex;align-items:flex-start;gap:8px;min-height:90px;cursor:pointer}
.opt:active{background:#e0e0e0}
.opt.ok{background:#d4edda}.opt.bad{background:#f8d7da}.opt.show{background:#d4edda}
.num{width:20px;height:20px;border-radius:4px;background:#ccc;color:#555;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.opt.ok .num,.opt.show .num{background:#28a745;color:#fff}
.opt.bad .num{background:#dc3545;color:#fff}
.txt{font-size:14px;color:#333;line-height:1.35}
.opt.ok .txt,.opt.show .txt{color:#155724;font-weight:600}
.opt.bad .txt{color:#721c24}
#finput{padding:16px 18px 20px;display:none;flex-direction:column;align-items:center;gap:10px;border-top:2px solid #eee}
#fanswer{font-size:20px;padding:12px 14px;border:2px solid #ddd;border-radius:10px;width:100%;text-align:center;background:#fff;color:#222;outline:none;-webkit-appearance:none}
#fanswer.ok{border-color:#28a745;background:#d4edda;color:#155724}
#fanswer.bad{border-color:#dc3545;background:#f8d7da;color:#721c24}
#fcheck{background:#F5A623;color:#fff;border:none;border-radius:10px;padding:13px;font-size:16px;font-weight:700;width:100%;-webkit-appearance:none;cursor:pointer}
#frow{padding:10px 14px;display:flex;align-items:flex-start;justify-content:space-between;min-height:48px;border-top:1px solid #eee;gap:8px}
#fb-wrap{flex:1;display:flex;flex-direction:column;gap:4px}
#fb{font-size:13px;font-weight:600}
#fnote{font-size:12px;color:#666;line-height:1.5;display:none;padding-top:2px}
.fbok{color:#155724}.fbbad{color:#721c24}
#nxt{background:#F5A623;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;display:none;-webkit-appearance:none;flex-shrink:0;align-self:center}
#stats{display:flex;border-top:1px solid #eee}
.st{flex:1;text-align:center;padding:9px 2px;border-right:1px solid #eee}
.st:last-child{border-right:none}
.sv{font-size:17px;font-weight:700;color:#333}
.sl{font-size:10px;color:#aaa;margin-top:2px}
#done{display:none;flex-direction:column;align-items:center;padding:28px 18px;text-align:center}
#done h2{font-size:22px;font-weight:700;color:#222;margin-bottom:6px}
#done p{font-size:13px;color:#777;margin-bottom:18px}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin-bottom:20px}
.dc{background:#f5f5f5;border-radius:10px;padding:12px}
.dv{font-size:22px;font-weight:700;color:#333}
.dl{font-size:11px;color:#aaa;margin-top:2px}
.dbtn{display:block;width:100%;border:none;border-radius:11px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:8px;-webkit-appearance:none}
.dbtn:last-child{margin-bottom:0}
.amber{background:#F5A623;color:#fff}
.red{background:#dc3545;color:#fff}

/* ── teacher view ── */
#teacher-view{display:none;flex:1;flex-direction:column;background:#f7f7f7}
#tv-toolbar{background:#fff;border-bottom:1px solid #eee;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0}
#tv-toolbar h2{font-size:16px;font-weight:700;color:#222}
#tv-toolbar-right{display:flex;gap:8px}
.tv-btn{border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;-webkit-appearance:none}
.tv-btn.amber{background:#F5A623;color:#fff}
.tv-btn.green{background:#28a745;color:#fff}
.tv-btn.gray{background:#eee;color:#555}
#tv-scroll{flex:1;overflow-y:auto;padding:12px 14px}

/* card editor */
.qcard{background:#fff;border-radius:12px;margin-bottom:12px;overflow:hidden;border:1px solid #e8e8e8}
.qcard-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#f9f9f9;border-bottom:1px solid #eee;cursor:pointer;gap:8px}
.qcard-num{font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.04em;flex-shrink:0}
.qcard-preview{font-size:13px;color:#555;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qcard-del{background:#f8d7da;border:none;border-radius:6px;padding:5px 10px;font-size:12px;font-weight:700;color:#721c24;cursor:pointer;flex-shrink:0}
.qcard-body{padding:12px 14px;display:none;flex-direction:column;gap:10px}
.qcard-body.open{display:flex}
.field-label{font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.field-input{width:100%;padding:9px 11px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px;background:#fff;color:#222;outline:none;-webkit-appearance:none;font-family:inherit}
.field-input:focus{border-color:#F5A623}
textarea.field-input{resize:vertical;min-height:60px;line-height:1.4}
.type-pills{display:flex;gap:6px;flex-wrap:wrap}
.type-pill{border:1.5px solid #e0e0e0;border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;color:#888;cursor:pointer;background:#fff}
.type-pill.active{border-color:#F5A623;background:#FEF9EE;color:#c17f00}
.opts-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt-wrap{display:flex;flex-direction:column;gap:4px}
#add-btn{display:block;width:100%;background:#fff;border:2px dashed #F5A623;border-radius:10px;padding:13px;font-size:14px;font-weight:700;color:#F5A623;cursor:pointer;text-align:center;margin-top:4px;margin-bottom:16px}
</style>
</head>
<body>

<div id="bar">
  <div id="prog-wrap"><div id="prog"></div></div>
  <div id="lv">Lv 1 · 0 XP</div>
  <button id="teacher-toggle">✏ Teacher</button>
</div>

<!-- QUIZ VIEW -->
<div id="quiz-view">
  <div id="retry-bar">🔁 Retesting cards you missed</div>
  <div id="stage">
    <div id="card">
      <div id="qhead">
        <div id="badge" class="bpos">loading</div>
        <div id="qtext">Getting ready…</div>
        <div id="qsub"></div>
      </div>
      <div id="grid">
        <div class="opt" id="o0"><div class="num">1</div><div class="txt"></div></div>
        <div class="opt" id="o1"><div class="num">2</div><div class="txt"></div></div>
        <div class="opt" id="o2"><div class="num">3</div><div class="txt"></div></div>
        <div class="opt" id="o3"><div class="num">4</div><div class="txt"></div></div>
      </div>
      <div id="finput">
        <div style="font-size:12px;color:#888;text-align:center">Type the formula — use plain numbers (e.g. H2O)</div>
        <input id="fanswer" type="text" inputmode="text" placeholder="Your answer…" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
        <button id="fcheck">Check ✓</button>
      </div>
      <div id="frow">
        <div id="fb-wrap">
          <div id="fb"></div>
          <div id="fnote"></div>
        </div>
        <button id="nxt">Next →</button>
      </div>
      <div id="stats">
        <div class="st"><div class="sv" id="sc">0</div><div class="sl">correct</div></div>
        <div class="st"><div class="sv" id="sr">0</div><div class="sl">retry</div></div>
        <div class="st"><div class="sv" id="ss">0</div><div class="sl">streak 🔥</div></div>
        <div class="st"><div class="sv" id="sa">—</div><div class="sl">accuracy</div></div>
      </div>
      <div id="done">
        <div style="font-size:44px;margin-bottom:8px">🎉</div>
        <h2>Session complete!</h2>
        <p id="dsub"></p>
        <div class="dg">
          <div class="dc"><div class="dv" id="dc1">0</div><div class="dl">correct</div></div>
          <div class="dc"><div class="dv" id="dc2">0</div><div class="dl">wrong</div></div>
          <div class="dc"><div class="dv" id="dc3">—</div><div class="dl">accuracy</div></div>
          <div class="dc"><div class="dv" id="dc4">0</div><div class="dl">XP earned</div></div>
        </div>
        <button class="dbtn red" id="d-retry" style="display:none">Retry missed cards</button>
        <button class="dbtn amber" id="d-again">Play again</button>
      </div>
    </div>
  </div>
</div>

<!-- TEACHER VIEW -->
<div id="teacher-view">
  <div id="tv-toolbar">
    <h2>✏ Question Editor</h2>
    <div id="tv-toolbar-right">
      <button class="tv-btn gray" id="tv-cancel">Cancel</button>
      <button class="tv-btn green" id="tv-save">Save & Play</button>
    </div>
  </div>
  <div id="tv-scroll">
    <div id="qlist"></div>
    <button id="add-btn">+ Add question</button>
  </div>
</div>

<script>
var DEFAULT_DATA=[
  {t:"pos",q:"Hydrogen",a:"H\u207A",x:["Na\u207A","K\u207A","Li\u207A","Ag\u207A"],note:""},
  {t:"pos",q:"Sodium",a:"Na\u207A",x:["K\u207A","Li\u207A","H\u207A","Ag\u207A"],note:""},
  {t:"pos",q:"Potassium",a:"K\u207A",x:["Na\u207A","Li\u207A","Ag\u207A","H\u207A"],note:""},
  {t:"pos",q:"Silver",a:"Ag\u207A",x:["Cu\u207A","H\u207A","Na\u207A","K\u207A"],note:""},

  {t:"pos",q:"Lithium",a:"Li\u207A",x:["Na\u207A","K\u207A","H\u207A","Ag\u207A"],note:""},
  {t:"pos",q:"Ammonium",a:"NH\u2084\u207A",x:["Na\u207A","K\u207A","Li\u207A","H\u207A"],note:""},
  {t:"pos",q:"Iron (II)",a:"Fe\u00B2\u207A",x:["Fe\u00B3\u207A","Co\u00B2\u207A","Zn\u00B2\u207A","Ca\u00B2\u207A"],note:"Iron can have two different valencies: Fe\u00B2\u207A (Iron II) and Fe\u00B3\u207A (Iron III). The roman numerals tell you which one."},
  {t:"pos",q:"Calcium",a:"Ca\u00B2\u207A",x:["Ba\u00B2\u207A","Mg\u00B2\u207A","Fe\u00B2\u207A","Co\u00B2\u207A"],note:""},
  {t:"pos",q:"Barium",a:"Ba\u00B2\u207A",x:["Ca\u00B2\u207A","Mg\u00B2\u207A","Co\u00B2\u207A","Fe\u00B2\u207A"],note:""},
  {t:"pos",q:"Magnesium",a:"Mg\u00B2\u207A",x:["Ca\u00B2\u207A","Ba\u00B2\u207A","Zn\u00B2\u207A","Fe\u00B2\u207A"],note:""},
  {t:"pos",q:"Cobalt",a:"Co\u00B2\u207A",x:["Cu\u00B2\u207A","Zn\u00B2\u207A","Fe\u00B2\u207A","Ca\u00B2\u207A"],note:""},
  {t:"pos",q:"Zinc",a:"Zn\u00B2\u207A",x:["Co\u00B2\u207A","Cu\u00B2\u207A","Mg\u00B2\u207A","Fe\u00B2\u207A"],note:""},
  {t:"pos",q:"Lead (II)",a:"Pb\u00B2\u207A",x:["Sn\u00B2\u207A","Pb\u2074\u207A","Cu\u00B2\u207A","Co\u00B2\u207A"],note:"Lead has two valencies: Pb\u00B2\u207A (Lead II) and Pb\u2074\u207A (Lead IV)."},
  {t:"pos",q:"Tin (II)",a:"Sn\u00B2\u207A",x:["Pb\u00B2\u207A","Sn\u2074\u207A","Zn\u00B2\u207A","Co\u00B2\u207A"],note:"Tin has two valencies: Sn\u00B2\u207A (Tin II) and Sn\u2074\u207A (Tin IV)."},
  {t:"pos",q:"Copper (II)",a:"Cu\u00B2\u207A",x:["Cu\u207A","Co\u00B2\u207A","Zn\u00B2\u207A","Fe\u00B2\u207A"],note:"Copper has two valencies: Cu\u207A (Copper I) and Cu\u00B2\u207A (Copper II)."},
  {t:"pos",q:"Aluminium",a:"Al\u00B3\u207A",x:["Cr\u00B3\u207A","Fe\u00B3\u207A","Sn\u2074\u207A","Pb\u2074\u207A"],note:""},
  {t:"pos",q:"Chromium (III)",a:"Cr\u00B3\u207A",x:["Al\u00B3\u207A","Fe\u00B3\u207A","Co\u00B2\u207A","Sn\u2074\u207A"],note:""},
  {t:"pos",q:"Iron (III)",a:"Fe\u00B3\u207A",x:["Fe\u00B2\u207A","Cr\u00B3\u207A","Al\u00B3\u207A","Co\u00B2\u207A"],note:"Iron can have two different valencies: Fe\u00B2\u207A (Iron II) and Fe\u00B3\u207A (Iron III)."},
  {t:"pos",q:"Tin (IV)",a:"Sn\u2074\u207A",x:["Sn\u00B2\u207A","Pb\u2074\u207A","Al\u00B3\u207A","Fe\u00B3\u207A"],note:""},
  {t:"pos",q:"Lead (IV)",a:"Pb\u2074\u207A",x:["Pb\u00B2\u207A","Sn\u2074\u207A","Cr\u00B3\u207A","Al\u00B3\u207A"],note:""},
  {t:"neg",q:"Fluoride",a:"F\u207B",x:["Cl\u207B","Br\u207B","I\u207B","OH\u207B"],note:""},
  {t:"neg",q:"Chloride",a:"Cl\u207B",x:["F\u207B","Br\u207B","I\u207B","OH\u207B"],note:""},
  {t:"neg",q:"Bromide",a:"Br\u207B",x:["Cl\u207B","I\u207B","F\u207B","OH\u207B"],note:""},
  {t:"neg",q:"Iodide",a:"I\u207B",x:["Br\u207B","Cl\u207B","F\u207B","OH\u207B"],note:""},
  {t:"neg",q:"Hydrogencarbonate",a:"HCO\u2083\u207B",x:["HSO\u2084\u207B","OH\u207B","NO\u2083\u207B","Cl\u207B"],note:""},
  {t:"neg",q:"Hydrogensulfate",a:"HSO\u2084\u207B",x:["HCO\u2083\u207B","OH\u207B","NO\u2083\u207B","Cl\u207B"],note:""},
  {t:"neg",q:"Hydroxide",a:"OH\u207B",x:["HCO\u2083\u207B","NO\u2083\u207B","F\u207B","Cl\u207B"],note:""},
  {t:"neg",q:"Ethanoate",a:"CH\u2083COO\u207B",x:["OH\u207B","NO\u2083\u207B","HCO\u2083\u207B","Cl\u207B"],note:""},
  {t:"neg",q:"Nitrate",a:"NO\u2083\u207B",x:["OH\u207B","HCO\u2083\u207B","HSO\u2084\u207B","Cl\u207B"],note:""},
  {t:"neg",q:"Oxide",a:"O\u00B2\u207B",x:["S\u00B2\u207B","SO\u2083\u00B2\u207B","CO\u2083\u00B2\u207B","N\u00B3\u207B"],note:""},
  {t:"neg",q:"Sulfide",a:"S\u00B2\u207B",x:["O\u00B2\u207B","SO\u2084\u00B2\u207B","CO\u2083\u00B2\u207B","N\u00B3\u207B"],note:""},
  {t:"neg",q:"Sulfite",a:"SO\u2083\u00B2\u207B",x:["SO\u2084\u00B2\u207B","S\u00B2\u207B","CO\u2083\u00B2\u207B","O\u00B2\u207B"],note:"Don't confuse sulfite (SO\u2083\u00B2\u207B) with sulfate (SO\u2084\u00B2\u207B) — sulfite has one fewer oxygen."},
  {t:"neg",q:"Sulfate",a:"SO\u2084\u00B2\u207B",x:["SO\u2083\u00B2\u207B","CO\u2083\u00B2\u207B","S\u00B2\u207B","O\u00B2\u207B"],note:"Don't confuse sulfate (SO\u2084\u00B2\u207B) with sulfite (SO\u2083\u00B2\u207B) — sulfate has one more oxygen."},
  {t:"neg",q:"Carbonate",a:"CO\u2083\u00B2\u207B",x:["SO\u2084\u00B2\u207B","SO\u2083\u00B2\u207B","PO\u2084\u00B3\u207B","S\u00B2\u207B"],note:""},
  {t:"neg",q:"Nitride",a:"N\u00B3\u207B",x:["P\u00B3\u207B","O\u00B2\u207B","S\u00B2\u207B","CO\u2083\u00B2\u207B"],note:""},
  {t:"neg",q:"Phosphide",a:"P\u00B3\u207B",x:["N\u00B3\u207B","O\u00B2\u207B","PO\u2084\u00B3\u207B","CO\u2083\u00B2\u207B"],note:""},
  {t:"neg",q:"Phosphate",a:"PO\u2084\u00B3\u207B",x:["CO\u2083\u00B2\u207B","SO\u2084\u00B2\u207B","P\u00B3\u207B","N\u00B3\u207B"],note:""},
  {t:"con",q:"What happens when a positive ion forms?",a:"Electrons are lost",x:["Electrons are gained","Protons are lost","Neutrons are shared","Electrons are shared"],note:"Positive ions (cations) form when an atom loses electrons. Fewer electrons than protons = net positive charge."},
  {t:"con",q:"What happens when a negative ion forms?",a:"Electrons are gained",x:["Electrons are lost","Protons are gained","Neutrons are lost","Electrons are shared"],note:"Negative ions (anions) form when an atom gains electrons. More electrons than protons = net negative charge."},
  {t:"con",q:"Why are noble gases unreactive?",a:"Their outer energy level is full",x:["They have no electrons","They have too many protons","They are too large","They repel all atoms"],note:"Noble gases have 8 electrons in their outer shell (helium has 2). This full outer shell makes them very stable — they don't need to gain or lose electrons."},
  {t:"con",q:"Metals tend to form… ions",a:"Positive",x:["Negative","Neutral","Covalent","Metallic"],note:"Metals are on the left of the periodic table. They lose electrons easily, forming positive ions (cations)."},
  {t:"con",q:"Non-metals tend to form… ions",a:"Negative",x:["Positive","Neutral","Covalent","Metallic"],note:"Non-metals are on the right of the periodic table. They gain electrons easily, forming negative ions (anions)."},
  {t:"con",q:"In an ionic compound, the overall charge is always…",a:"Zero (neutral)",x:["Positive","Negative","Equal to the cation","Variable"],note:"The positive and negative charges always balance out in an ionic compound. E.g. NaCl: Na\u207A and Cl\u207B cancel to give zero overall charge."},
  {t:"con",q:"The charge on an ion is called its…",a:"Valency",x:["Valence","Charge number","Electron count","Atomic number"],note:"Valency refers to the charge of an ion. It tells you how many electrons were gained or lost."},
  {t:"con",q:"When a non-metal becomes an ion the name ending becomes…",a:"-ide (e.g. fluoride)",x:["-ate","-ite","-ium","-ous"],note:"Simple non-metal ions end in -ide. E.g. fluorine \u2192 fluoride, oxygen \u2192 oxide, nitrogen \u2192 nitride. Note: polyatomic ions like sulfate and nitrate end in -ate or -ite instead."},
  {t:"form",q:"Formula for sodium chloride",a:"NaCl",note:"Na\u207A + Cl\u207B \u2192 NaCl. Charges cancel: +1 and -1."},
  {t:"form",q:"Formula for calcium chloride",a:"CaCl2",note:"Ca\u00B2\u207A + 2Cl\u207B \u2192 CaCl\u2082. You need two chloride ions to balance the 2+ charge of calcium."},
  {t:"form",q:"Formula for magnesium oxide",a:"MgO",note:"Mg\u00B2\u207A + O\u00B2\u207B \u2192 MgO. Both have a charge of 2, so one of each balances perfectly."},
  {t:"form",q:"Formula for aluminium oxide",a:"Al2O3",note:"Al\u00B3\u207A + O\u00B2\u207B \u2192 Al\u2082O\u2083. You need 2 aluminium (+6 total) and 3 oxide (-6 total) to balance."},
  {t:"form",q:"Formula for sodium hydroxide",a:"NaOH",note:"Na\u207A + OH\u207B \u2192 NaOH. One of each balances the charges."},
  {t:"form",q:"Formula for calcium carbonate",a:"CaCO3",note:"Ca\u00B2\u207A + CO\u2083\u00B2\u207B \u2192 CaCO\u2083. Both have a 2 charge, so one of each balances."},
  {t:"form",q:"Formula for potassium nitrate",a:"KNO3",note:"K\u207A + NO\u2083\u207B \u2192 KNO\u2083. Both have a 1 charge, so one of each."},
  {t:"form",q:"Formula for zinc sulfate",a:"ZnSO4",note:"Zn\u00B2\u207A + SO\u2084\u00B2\u207B \u2192 ZnSO\u2084. Both have a 2 charge, so one of each balances."},
];

// working data (copied from default, editable)
var DATA=DEFAULT_DATA.map(function(d){return JSON.parse(JSON.stringify(d));});

// ── quiz state ──
var deck=[],weak=[],cur=null,answered=false;
var C=0,W=0,streak=0,xp=0,lv=1,sxp=0;

function shuf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function showQuiz(){
  document.getElementById("quiz-view").style.display="flex";
  document.getElementById("teacher-view").style.display="none";
  document.getElementById("teacher-toggle").textContent="✏ Teacher";
}
function showTeacher(){
  document.getElementById("quiz-view").style.display="none";
  document.getElementById("teacher-view").style.display="flex";
  document.getElementById("teacher-toggle").textContent="✏ Teacher";
  renderEditor();
}

wire("teacher-toggle",function(){
  var tv=document.getElementById("teacher-view");
  if(tv.style.display==="flex"){showQuiz();}else{showTeacher();}
});

function start(){
  deck=shuf(DATA.slice());
  weak=[];C=0;W=0;streak=0;sxp=0;
  document.getElementById("done").style.display="none";
  document.getElementById("qhead").style.display="block";
  document.getElementById("grid").style.display="grid";
  document.getElementById("frow").style.display="flex";
  document.getElementById("stats").style.display="flex";
  document.getElementById("retry-bar").style.display="none";
  document.getElementById("finput").style.display="none";
  updateStats();next();
}

function next(){
  answered=false;
  document.getElementById("nxt").style.display="none";
  document.getElementById("fb").textContent="";
  document.getElementById("fb").className="";
  document.getElementById("fnote").style.display="none";
  document.getElementById("fnote").textContent="";

  if(!deck.length&&!weak.length){finish();return;}
  if(!deck.length){deck=shuf(weak.slice());weak=[];document.getElementById("retry-bar").style.display="block";}

  cur=deck.shift();updateProg();
  var bmap={pos:"bpos positive ion",neg:"bneg negative ion",con:"bcon ion theory",form:"bform formula writing"};
  var bp=(bmap[cur.t]||"bcon theory").split(" ");
  var badge=document.getElementById("badge");
  badge.className=bp[0];badge.textContent=bp.slice(1).join(" ");

  cur._flip=false;
  var qt,qs="";
  if(cur.t==="form"||cur.t==="con"){qt=cur.q;qs=cur.t==="form"?"Formula Writing":"Ion Theory";}
  else{var ns=Math.random()<0.5;qt=ns?cur.q:cur.a;qs=ns?"What is the symbol?":"What is the name?";cur._flip=!ns;}
  document.getElementById("qtext").textContent=qt;
  document.getElementById("qsub").textContent=qs;

  if(cur.t==="form"){
    document.getElementById("grid").style.display="none";
    document.getElementById("finput").style.display="flex";
    var fi=document.getElementById("fanswer");
    fi.value="";fi.className="";fi.disabled=false;
    document.getElementById("fcheck").disabled=false;
  } else {
    document.getElementById("grid").style.display="grid";
    document.getElementById("finput").style.display="none";
    var correct,dists;
    if(cur.t==="con"){correct=cur.a;dists=shuf(cur.x.slice()).slice(0,3);}
    else if(cur._flip){
      correct=cur.q;
      var pool=DATA.filter(function(c){return c!==cur&&(c.t==="pos"||c.t==="neg");});
      dists=shuf(pool).map(function(c){return c.q;}).slice(0,3);
    } else {correct=cur.a;dists=shuf(cur.x.slice()).slice(0,3);}
    var opts=shuf([correct,dists[0],dists[1],dists[2]]);
    cur._ca=correct;
    for(var i=0;i<4;i++){
      var el=document.getElementById("o"+i);
      el.className="opt";
      el.querySelector(".txt").textContent=opts[i]||"";
      el.dataset.val=opts[i]||"";
    }
    bindOpts(correct);
  }
}

function showNote(){
  if(cur.note&&cur.note.trim()){
    var fn=document.getElementById("fnote");
    fn.textContent=cur.note;
    fn.style.display="block";
  }
}

function bindOpts(correct){
  for(var i=0;i<4;i++){
    (function(el){
      var newEl=el.cloneNode(true);
      el.parentNode.replaceChild(newEl,el);
      function handle(e){if(e.type==="touchend")e.preventDefault();pick(newEl,newEl.dataset.val,correct);}
      newEl.addEventListener("touchend",handle,{passive:false});
      newEl.addEventListener("click",handle);
    })(document.getElementById("o"+i));
  }
}

function pick(el,chosen,correct){
  if(answered)return;answered=true;
  for(var i=0;i<4;i++){
    var t=document.getElementById("o"+i);
    if(t.dataset.val===correct)t.classList.add("show");
  }
  var fb=document.getElementById("fb");
  if(chosen===correct){
    el.classList.add("ok");el.classList.remove("show");
    C++;streak++;var bonus=streak>=3?5:0;xp+=15+bonus;sxp+=15+bonus;
    fb.textContent=streak>=3?"✓ "+streak+" streak! +"+(15+bonus)+" XP":"✓ Correct!";
    fb.className="fbok";lvCheck();
  } else {
    el.classList.add("bad");W++;streak=0;weak.push(cur);
    fb.textContent="✗ Answer: "+correct;fb.className="fbbad";
  }
  showNote();updateStats();document.getElementById("nxt").style.display="block";
}

function checkFormula(){
  if(answered)return;
  var fi=document.getElementById("fanswer");
  var raw=fi.value.trim();if(!raw)return;
  answered=true;fi.disabled=true;document.getElementById("fcheck").disabled=true;
  function norm(s){return s.replace(/[\u2070-\u2079\u00B2\u00B3\u00B9]/g,function(c){return"0123456789"["\u2070\u00B9\u00B2\u00B3\u2074\u2075\u2076\u2077\u2078\u2079".indexOf(c)];}).replace(/\s/g,"");}
  var ok=norm(raw).toLowerCase()===norm(cur.a).toLowerCase();
  var fb=document.getElementById("fb");
  if(ok){fi.className="ok";C++;streak++;xp+=20;sxp+=20;fb.textContent="✓ Correct!";fb.className="fbok";lvCheck();}
  else{fi.className="bad";W++;streak=0;weak.push(cur);fb.textContent="✗ Answer: "+cur.a;fb.className="fbbad";}
  showNote();updateStats();document.getElementById("nxt").style.display="block";
}

function lvCheck(){while(xp>=lv*100){xp-=lv*100;lv++;}document.getElementById("lv").textContent="Lv "+lv+" \u00B7 "+xp+" XP";}
function updateStats(){
  document.getElementById("sc").textContent=C;
  document.getElementById("sr").textContent=weak.length;
  document.getElementById("ss").textContent=streak;
  var tot=C+W;document.getElementById("sa").textContent=tot?Math.round(C/tot*100)+"%":"—";
}
function updateProg(){
  var tot=C+W+deck.length+1;
  document.getElementById("prog").style.width=Math.round((C+W)/tot*100)+"%";
}
function finish(){
  document.getElementById("qhead").style.display="none";
  document.getElementById("grid").style.display="none";
  document.getElementById("finput").style.display="none";
  document.getElementById("frow").style.display="none";
  document.getElementById("stats").style.display="none";
  document.getElementById("done").style.display="flex";
  var tot=C+W;
  document.getElementById("dc1").textContent=C;
  document.getElementById("dc2").textContent=W;
  document.getElementById("dc3").textContent=tot?Math.round(C/tot*100)+"%":"—";
  document.getElementById("dc4").textContent=sxp;
  document.getElementById("dsub").textContent="Level "+lv+" \u00B7 "+tot+" cards";
  var dr=document.getElementById("d-retry");
  dr.style.display=weak.length?"block":"none";
  if(weak.length)dr.textContent="Retry "+weak.length+" missed card"+(weak.length>1?"s":"");
  document.getElementById("prog").style.width="100%";
}

wire("nxt",next);
wire("fcheck",checkFormula);
wire("d-again",start);
wire("d-retry",function(){
  deck=shuf(weak.slice());weak=[];
  document.getElementById("done").style.display="none";
  document.getElementById("qhead").style.display="block";
  document.getElementById("grid").style.display="grid";
  document.getElementById("frow").style.display="flex";
  document.getElementById("stats").style.display="flex";
  document.getElementById("retry-bar").style.display="block";
  document.getElementById("finput").style.display="none";
  next();
});
document.getElementById("fanswer").addEventListener("keydown",function(e){if(e.key==="Enter")checkFormula();});

// ── teacher editor ──
var TYPES=["pos","neg","con","form"];
var TYPE_LABELS={"pos":"Positive ion","neg":"Negative ion","con":"Ion theory","form":"Formula"};

function renderEditor(){
  var list=document.getElementById("qlist");
  list.innerHTML="";
  DATA.forEach(function(d,i){renderCard(d,i,list);});
}

function renderCard(d,i,list){
  var wrap=document.createElement("div");
  wrap.className="qcard";
  wrap.id="qc"+i;

  // header
  var hdr=document.createElement("div");
  hdr.className="qcard-header";
  hdr.innerHTML='<span class="qcard-num">Q'+(i+1)+'</span><span class="qcard-preview">'+escHtml(d.q)+'</span><button class="qcard-del">Delete</button>';
  wrap.appendChild(hdr);

  // body
  var body=document.createElement("div");
  body.className="qcard-body";

  // type pills
  var tblock=document.createElement("div");
  tblock.innerHTML='<div class="field-label">Type</div>';
  var pills=document.createElement("div");pills.className="type-pills";
  TYPES.forEach(function(tp){
    var p=document.createElement("div");
    p.className="type-pill"+(d.t===tp?" active":"");
    p.textContent=TYPE_LABELS[tp];
    p.addEventListener("click",function(){
      d.t=tp;
      pills.querySelectorAll(".type-pill").forEach(function(x){x.classList.remove("active");});
      p.classList.add("active");
    });
    pills.appendChild(p);
  });
  tblock.appendChild(pills);body.appendChild(tblock);

  // question
  body.appendChild(makeField("Question / term",d.q,function(v){d.q=v;hdr.querySelector(".qcard-preview").textContent=v;}));

  // answer
  body.appendChild(makeField("Correct answer",d.a,function(v){d.a=v;}));

  // wrong options (only for non-formula)
  var optsBlock=document.createElement("div");
  optsBlock.innerHTML='<div class="field-label" style="margin-bottom:6px">Wrong options (3)</div>';
  var og=document.createElement("div");og.className="opts-grid";
  for(var j=0;j<3;j++){
    (function(j){
      var ow=document.createElement("div");ow.className="opt-wrap";
      var lbl=document.createElement("div");lbl.className="field-label";lbl.textContent="Option "+(j+1);
      var inp=document.createElement("input");
      inp.className="field-input";inp.type="text";inp.value=d.x[j]||"";
      inp.addEventListener("input",function(){d.x[j]=inp.value;});
      ow.appendChild(lbl);ow.appendChild(inp);og.appendChild(ow);
    })(j);
  }
  optsBlock.appendChild(og);body.appendChild(optsBlock);

  // note
  body.appendChild(makeTextarea("Explanation note (shown after answer)",d.note||"",function(v){d.note=v;}));

  wrap.appendChild(body);

  // toggle open/close on header click
  hdr.addEventListener("click",function(e){
    if(e.target.classList.contains("qcard-del"))return;
    body.classList.toggle("open");
  });

  // delete
  hdr.querySelector(".qcard-del").addEventListener("click",function(e){
    e.stopPropagation();
    if(confirm("Delete this question?")){DATA.splice(i,1);renderEditor();}
  });

  list.appendChild(wrap);
}

function makeField(label,val,onChange){
  var wrap=document.createElement("div");
  var lbl=document.createElement("div");lbl.className="field-label";lbl.textContent=label;
  var inp=document.createElement("input");inp.className="field-input";inp.type="text";inp.value=val;
  inp.addEventListener("input",function(){onChange(inp.value);});
  wrap.appendChild(lbl);wrap.appendChild(inp);return wrap;
}
function makeTextarea(label,val,onChange){
  var wrap=document.createElement("div");
  var lbl=document.createElement("div");lbl.className="field-label";lbl.textContent=label;
  var ta=document.createElement("textarea");ta.className="field-input";ta.value=val;ta.rows=3;
  ta.addEventListener("input",function(){onChange(ta.value);});
  wrap.appendChild(lbl);wrap.appendChild(ta);return wrap;
}

wire("add-btn",function(){
  DATA.push({t:"con",q:"New question",a:"Correct answer",x:["Wrong 1","Wrong 2","Wrong 3"],note:""});
  renderEditor();
  // open the new card
  var cards=document.querySelectorAll(".qcard-body");
  if(cards.length)cards[cards.length-1].classList.add("open");
  document.getElementById("tv-scroll").scrollTop=999999;
});
wire("tv-save",function(){showQuiz();start();});
wire("tv-cancel",function(){showQuiz();});

function escHtml(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function wire(id,fn){
  var el=document.getElementById(id);
  if(!el)return;
  el.addEventListener("touchend",function(e){e.preventDefault();fn();},{passive:false});
  el.addEventListener("click",fn);
}

start();
</script>
</body>
</html>
